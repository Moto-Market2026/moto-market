<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Moto Market</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo-container">
            <img src="logo-moto-market.png" alt="Logo de Moto Market" class="logo">
        </div>

        <a href="index.html">Inicio</a>
        <a href="motos.html">Nuestras motos</a>
        <a href="voitures.html">Nuestros coches</a>
        <a href="apropos.html">Sobre nosotros</a>
        <a href="contact.html">Contacto</a>
    </nav>

    <section class="contact">
        <h1>Contáctanos</h1>

        <p>¿Quieres comprar una moto? Contáctanos.</p>

        <form onsubmit="enviarMensaje(); return false;">
            <input type="text" id="nom" placeholder="Tu nombre" required>

            <input type="tel" id="telephone" placeholder="Tu teléfono" required>

            <input type="email" id="email" placeholder="Tu correo electrónico" required>

            <textarea id="message" placeholder="Tu mensaje" required></textarea>

            <button type="submit">Enviar por WhatsApp</button>
        </form>
    </section>

    <footer>
        <p>© 2026 Moto Market</p>
        <p>Venta de motos y coches</p>
    </footer>

    <a class="whatsapp"
       href="https://wa.me/2290162905754?text=Hola%2C%20vengo%20de%20la%20web%20de%20Moto%20Market."
       target="_blank">
        WhatsApp
    </a>

    <script>
        function enviarMensaje() {
            const nom = document.getElementById("nom").value;
            const telefono = document.getElementById("telephone").value;
            const email = document.getElementById("email").value;
            const mensaje = document.getElementById("message").value;

            const texto =
                "Hola, vengo de la web de Moto Market.%0A%0A" +
                "Nombre: " + encodeURIComponent(nom) + "%0A" +
                "Teléfono: " + encodeURIComponent(telefono) + "%0A" +
                "Correo electrónico: " + encodeURIComponent(email) + "%0A" +
                "Mensaje: " + encodeURIComponent(mensaje);

            window.open(
                "https://wa.me/2290162905754?text=" + texto,
                "_blank"
            );
        }
    </script>

</body>
</html>
