    <section class="contact">

        <h1>Contactez-nous</h1>

        <p>Vous souhaitez acheter une moto ? Contactez-nous.</p>


        <form onsubmit="envoyerMessage(); return false;">

    <input type="text" id="nom" placeholder="Votre nom" required>

    <input type="tel" id="telephone" placeholder="Votre téléphone" required>

    <input type="email" id="email" placeholder="Votre email" required>

    <textarea id="message" placeholder="Votre message" required></textarea>

    <button type="submit">Envoyer sur WhatsApp</button>

</form>

    <script>
    function envoyerMessage() {

        let nom = document.getElementById("nom").value;
        let telephone = document.getElementById("telephone").value;
        let email = document.getElementById("email").value;
        let message = document.getElementById("message").value;

        let texte =
            "Bonjour, je viens de votre site Moto Market.%0A%0A" +
            "Nom : " + encodeURIComponent(nom) + "%0A" +
            "Téléphone : " + encodeURIComponent(telephone) + "%0A" +
            "Email : " + encodeURIComponent(email) + "%0A" +
            "Message : " + encodeURIComponent(message);

        window.open(
            "https://wa.me/2290162905754?text=" + texte,
            "_blank"
        );
    }
</script>
